.note{font-size:12.5px;color:var(--muted);line-height:1.5}

.btn-sm{height:30px;padding:0 10px;font-size:13px;border-radius:7px}
.btn-lg{height:44px;padding:0 18px;font-size:15px;border-radius:10px}
.btn-primary{background:var(--primary);color:var(--on-primary)}
.btn-primary.is-hover{background:var(--primary-hover)}
.btn-secondary{background:var(--surface);color:var(--text);border-color:var(--line-2)}

.spin{width:15px;height:15px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;opacity:.85}
.label{font-size:13px;font-weight:500;color:var(--text-2)}
.input{height:40px;border:1px solid var(--field);border-radius:8px;padding:0 12px;background:var(--surface);font-size:15px;color:var(--text);display:flex;align-items:center;gap:8px}

.toggle{width:36px;height:22px;border-radius:999px;background:var(--line-2);position:relative;flex:none}
.toggle::after{content:'';position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.toggle.on{background:var(--primary)}.toggle.on::after{left:17px}
.t-dark .toggle.on::after{background:#0F1615}

    for (let y = 12.6; y < 88; y += 2.6) for (let x = 12.6; x < 88; x += 2.6) { const jx = x + (rnd() - .5) * 1.5, jy = y + (rnd() - .5) * 1.5; if (inTile(jx, jy)) T.push([jx, jy, 0]); }
    for (let y = 18; y < 48; y += 1.9) for (let x = 52; x < 82; x += 1.9) { const jx = x + (rnd() - .5) * .5, jy = y + (rnd() - .5) * .5; if (inSeed(jx, jy)) T.push([jx, jy, 1]); }
    // particles
    const P = T.map((t) => ({ tx: t[0], ty: t[1], sky: t[2], x0: rnd(), y0: rnd(), vx: (rnd() - .5) * 18, vy: -6 - rnd() * 10,
      a0: rnd() * 6.28, spin: (rnd() - .5) * .9, z: .35 + rnd() * .65, pw: 9 + rnd() * 12, ph: rnd() * 6.28, f1: .6 + rnd() * .8,
      d: rnd() * 1.4, r: 1.1 + rnd() * .9, paper: rnd() < .22, flip: .4 + rnd() * .9 }));
    const B = Array.from({ length: 16 }, () => ({ x: rnd(), y: rnd(), r: 40 + rnd() * 90, sp: .004 + rnd() * .01, ph: rnd() * 6.28, a: .05 + rnd() * .08 }));
    // glow sprites
    const sprite = (c1, c2) => { const c = document.createElement('canvas'); c.width = c.height = 64; const g = c.getContext('2d');
      const gr = g.createRadialGradient(32, 32, 0, 32, 32, 32); gr.addColorStop(0, c1); gr.addColorStop(.25, c2); gr.addColorStop(1, 'rgba(0,0,0,0)');
      g.fillStyle = gr; g.fillRect(0, 0, 64, 64); return c; };
    const SG = sprite('rgba(235,255,245,1)', 'rgba(111,203,157,.55)');
    const SS = sprite('rgba(240,250,255,1)', 'rgba(124,200,238,.6)');
    const LOOP = 16;
    const ease = (u) => u < 0 ? 0 : u > 1 ? 1 : u * u * (3 - 2 * u);
    const ease2 = (u) => u < 0 ? 0 : u > 1 ? 1 : (u < .5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2);
    const draw = (time) => {
      size();
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
      const t = time % LOOP;
      // background
      const bg = ctx.createRadialGradient(W * .5, H * .42, 10, W * .5, H * .5, Math.max(W, H) * .8);
      bg.addColorStop(0, '#163A2E'); bg.addColorStop(.6, '#0C2219'); bg.addColorStop(1, '#06120D');
      ctx.globalCompositeOperation = 'source-over'; ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
      // bokeh
      ctx.globalCompositeOperation = 'lighter';
      for (const b of B) { const x = ((b.x + time * b.sp) % 1.2 - .1) * W, y = (b.y + Math.sin(time * .1 + b.ph) * .03) * H;
        const g = ctx.createRadialGradient(x, y, 0, x, y, b.r); g.addColorStop(0, `rgba(120,190,150,${b.a})`); g.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = g; ctx.fillRect(x - b.r, y - b.r, b.r * 2, b.r * 2); }
      // logo frame
      const L = Math.min(W, H) * .62, ox = (W - L) / 2, oy = H * .44 - L / 2, k = L / 100;
      // global gather factor (for glow behind the logo)
      const gAll = t < 5 ? 0 : t < 9.5 ? ease((t - 5) / 4.5) : t < 12.5 ? 1 : 1 - ease((t - 12.5) / 3);
      if (gAll > 0) {
        const cx = ox + 50 * k, cy = oy + 50 * k;
        const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, L * .75); g.addColorStop(0, `rgba(80,180,130,${.18 * gAll})`); g.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = g; ctx.fillRect(cx - L, cy - L, 2 * L, 2 * L);
        const sx = ox + 67 * k, sy = oy + 33 * k, pulse = .55 + .45 * Math.sin(Math.max(0, t - 9) * 2.2);
        const gs = ctx.createRadialGradient(sx, sy, 0, sx, sy, L * .28); gs.addColorStop(0, `rgba(155,218,246,${.16 * gAll * pulse})`); gs.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = gs; ctx.fillRect(sx - L, sy - L, 2 * L, 2 * L);
      }
      for (const p of P) {
        // scattered position: drifting paper (continuous in time)
        const sx = ((p.x0 * (W + 120) + time * p.vx + Math.sin(time * .23 * p.f1 + p.ph) * 30) % (W + 120) + (W + 120)) % (W + 120) - 60;
        const sy = ((p.y0 * (H + 120) + time * p.vy + Math.sin(time * .17 * p.f1 + p.ph * 2) * 22) % (H + 120) + (H + 120)) % (H + 120) - 60;
        // per-particle gather amount
        let b;
        if (t < 5) b = 0; else if (t < 9.5) b = ease2((t - 5 - p.d) / 3.0); else if (t < 12.5) b = 1; else b = 1 - ease2((t - 12.5 - p.d * .6) / 2.6);
        const br = Math.sin(time * 1.6 + p.ph) * .35;
        const tx = ox + (p.tx + br * .4) * k, ty = oy + (p.ty + br * .3) * k;
        const lift = (t > 12.5 ? -60 : 0) * Math.sin(Math.PI * (1 - b)) * (1 - b);
        const x = sx + (tx - sx) * b, y = sy + (ty - sy) * b + lift;
        // paper (fades out as b rises)
        if (b < .98 && p.paper) {
          ctx.globalCompositeOperation = 'source-over';
          ctx.save(); ctx.translate(x, y); ctx.rotate(p.a0 + time * p.spin * (1 - b));
          ctx.scale(Math.max(.15, Math.abs(Math.cos(time * p.flip + p.ph))), 1);
          const sc = (1 - b) * (.5 + .9 * p.z); const w = (p.pw + 6) * sc, h = (p.pw + 6) * 1.32 * sc;
          const a = (.08 + .5 * p.z * p.z) * (1 - b);
          ctx.fillStyle = `rgba(0,0,0,${a * .35})`; ctx.fillRect(-w / 2 + 2, -h / 2 + 3, w, h);
          ctx.fillStyle = `rgba(240,237,226,${a})`; ctx.fillRect(-w / 2, -h / 2, w, h);
          ctx.fillStyle = `rgba(90,110,100,${a * .8})`;
          for (let i = 1; i < 5; i++) ctx.fillRect(-w * .36, -h / 2 + h * i / 5.6, w * (i === 1 ? .45 : .72), Math.max(.5, h * .028));
          ctx.restore();
        } else if (b < .98) {
          ctx.globalCompositeOperation = 'lighter';
          ctx.globalAlpha = (1 - b) * .25 * p.z; ctx.drawImage(SG, x - 3, y - 3, 6, 6); ctx.globalAlpha = 1;
        }
        if (b > .02) {
          ctx.globalCompositeOperation = 'lighter';
          const r = (p.r * 4.3) * (.7 + .3 * b) * (p.sky ? 1.1 : 1);
          ctx.globalAlpha = Math.min(1, b * (.55 + .35 * p.z));
          ctx.drawImage(p.sky ? SS : SG, x - r, y - r, 2 * r, 2 * r);
          ctx.globalAlpha = 1;
        }
      }
      // vignette + grain
      ctx.globalCompositeOperation = 'source-over';
      const v = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * .35, W / 2, H / 2, Math.max(W, H) * .75);
      v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,.45)'); ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
    };
    window.__fxRender = (t) => draw(t);
    const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduce) { draw(11); return; }
    const t0 = performance.now();
    const loop = (now) => { if (this.stopped) return; draw((now - t0) / 1000 + 1.5); this.raf = requestAnimationFrame(loop); };
    this.onVis = () => { if (document.hidden) cancelAnimationFrame(this.raf); else this.raf = requestAnimationFrame(loop); };
    document.addEventListener('visibilitychange', this.onVis);
    this.raf = requestAnimationFrame(loop);
  }
  renderVals() { return { setCv: (el) => { this.cv = el; } }; }
}
</script>
