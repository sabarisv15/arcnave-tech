# ArcNave frontend: static assets, plus a reverse proxy to the API on the same origin.
#
# Same-origin matters. The session is an HttpOnly cookie with SameSite=Lax; served from a
# different origin than the API it would need SameSite=None, which is a materially weaker
# cookie. Proxying /v1 here means the browser only ever talks to one origin, so CORS is not
# in the request path at all in production.

server {
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Uploads are capped by the backend; this only has to be large enough not to reject a
    # request before it gets there, so the error comes back typed instead of as nginx HTML.
    client_max_body_size 32m;

    # Nothing here should be guessed at by a browser.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "DENY"    always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # Hashed filenames are immutable by construction; index.html must never be, or a deploy
    # leaves clients on the previous bundle until their cache expires.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /v1/ {
        proxy_pass         http://backend:8080/v1/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Streaming. Without these three, nginx buffers the whole SSE response and delivers it
        # at once, which looks exactly like a model that produced nothing for thirty seconds
        # and then everything. The backend also sends X-Accel-Buffering: no.
        proxy_buffering    off;
        proxy_cache        off;
        chunked_transfer_encoding on;

        # A generation can legitimately run for minutes. The default 60s read timeout would
        # cut a long research answer off mid-stream.
        proxy_read_timeout 10m;
        proxy_send_timeout 10m;
    }

    location = /healthz { proxy_pass http://backend:8080/healthz; }
    location = /readyz  { proxy_pass http://backend:8080/readyz;  }

    # Client-side routing: any unknown path is a React route, not a missing file.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
