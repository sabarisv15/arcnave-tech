# ArcNave frontend: static assets, plus a reverse proxy to the API on the same origin.
#
# Same-origin matters. The session is an HttpOnly cookie with SameSite=Lax; served from a
# different origin than the API it would need SameSite=None, which is a materially weaker
# cookie. Proxying /v1 here means the browser only ever talks to one origin, so CORS is not
# in the request path at all in production.

# This file is included inside nginx's http block, so a map can live here.
map $uri $arcnave_cache_control {
    ~^/assets/    "public, immutable";
    /index.html   "no-cache";
    default       "";
}

server {
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Uploads are capped by the backend; this only has to be large enough not to reject a
    # request before it gets there, so the error comes back typed instead of as nginx HTML.
    client_max_body_size 32m;

    # Security headers (Stage 16 SE10, PH-2, ADR-0065), the same set as public/_headers, which is
    # what the production host (Cloudflare) serves. nginx drops server-level add_header lines in
    # any location that has its own add_header, so no location below adds one; Cache-Control
    # comes from the map above instead. The CSP is report-only until its reports are clean.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "DENY"    always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy     "camera=(), geolocation=(), payment=(), usb=(), microphone=(self)" always;
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'sha256-ywfA1xrSSFueav2Lu0GF0mgfijAZm+LUWb2wex4spZo=' https://accounts.google.com/gsi/client https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://*.run.app https://storage.googleapis.com https://accounts.google.com/gsi/; frame-src 'self' blob: https://accounts.google.com/gsi/; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header Cache-Control $arcnave_cache_control;

    # Hashed filenames are immutable by construction (map above); index.html must never be, or a
    # deploy leaves clients on the previous bundle until their cache expires.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    location /v1/ {
        proxy_pass         http://backend:8080/v1/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Streaming. Without these three, nginx buffers the whole SSE response and delivers it
        # at once, which looks exactly like a model that produced nothing for thirty seconds
        # and then everything. The backend also sends X-Accel-Buffering: no.
        proxy_buffering    off;
        proxy_cache        off;
        chunked_transfer_encoding on;

        # A generation can legitimately run for minutes. The default 60s read timeout would
        # cut a long research answer off mid-stream.
        proxy_read_timeout 10m;
        proxy_send_timeout 10m;
    }

    location = /health  { proxy_pass http://backend:8080/health;  }
    location = /healthz { proxy_pass http://backend:8080/healthz; }
    location = /readyz  { proxy_pass http://backend:8080/readyz;  }

    # Client-side routing: any unknown path is a React route, not a missing file.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
